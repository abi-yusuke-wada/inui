<!doctype html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>inui 旧形式UIモックアップ</title>
  <link rel="stylesheet" href="groupware.css">
</head>
<body>
  <!-- 比較用の旧形式UI。メニューと画面遷移で目的の画面へたどり着く。
       表示する業務UIは groupware.html（inui）と同じ事前実装済みUIを使い、入口だけを変える。 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" fill="#fff"/><rect x="3" y="5" width="18" height="5" rx="2" fill="#d9483b"/><text x="12" y="19" text-anchor="middle" font-size="8" font-weight="700" fill="#333">2</text></symbol>
      <symbol id="i-survey" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" fill="#fff"/><path d="M8 8h8M8 12h8M8 16h5" stroke="#3a7bd5" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="3 2.5"/><circle cx="12" cy="12" r="3" fill="#fff"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 12 12 5l8 7v8h-5v-5H9v5H4z" fill="#fff"/></symbol>
    </defs>
  </svg>

  <header class="gw-header">
    <div class="gw-brand">
      <span class="brand-mark" aria-hidden="true">i</span>
      <span class="brand-name">inui</span>
    </div>
    <nav class="mode-switch" aria-label="入口の切り替え">
      <a href="groupware.html">inui（自然言語）</a>
      <a href="legacy.html" aria-current="page">旧形式（メニュー）</a>
    </nav>
    <div class="gw-user">
      <span>2026年11月2日（月）09:00</span>
      <span class="gw-avatar" aria-hidden="true">検</span>
      <span>検証ユーザー</span>
    </div>
  </header>

  <nav class="gw-tabs" aria-label="ポータル">
    <span class="gw-tab is-active">ポータル</span>
  </nav>

  <div class="gw-layout">
    <nav class="gw-rail" aria-label="機能">
      <button type="button" class="rail-btn" data-nav="portal" title="ポータル">
        <span class="app-icon icon-green"><svg><use href="#i-home"/></svg></span>
      </button>
      <button type="button" class="rail-btn" data-nav="week" title="スケジュール">
        <span class="app-icon icon-blue"><svg><use href="#i-calendar"/></svg></span>
      </button>
      <button type="button" class="rail-btn" data-nav="survey" title="アンケート">
        <span class="app-icon icon-orange"><svg><use href="#i-survey"/></svg></span>
      </button>
      <button type="button" class="rail-btn" data-nav="settings" title="個人設定">
        <span class="app-icon icon-gray"><svg><use href="#i-settings"/></svg></span>
      </button>
    </nav>

    <main class="gw-main gw-main-wide" id="legacy-main" data-screen="portal">
      <p class="breadcrumb" id="breadcrumb">ポータル</p>

      <!-- 事前実装済みUI（アンケート・予定一覧・表示設定）を app.js が描画する -->
      <section id="result" class="result" aria-live="polite"></section>

      <!-- ポータル -->
      <div class="portal screen-portal">
        <section class="panel">
          <h2 class="panel-title">メニュー</h2>
          <div class="panel-body menu-grid">
            <button type="button" class="menu-item" data-nav="week">
              <span class="app-icon icon-blue"><svg><use href="#i-calendar"/></svg></span>スケジュール
            </button>
            <button type="button" class="menu-item" data-nav="survey">
              <span class="app-icon icon-orange"><svg><use href="#i-survey"/></svg></span>アンケート
            </button>
            <button type="button" class="menu-item" data-nav="settings">
              <span class="app-icon icon-gray"><svg><use href="#i-settings"/></svg></span>個人設定
            </button>
          </div>
        </section>
        <section class="panel panel-accent">
          <h2 class="panel-title">お知らせ</h2>
          <div class="panel-body">
            <p class="info-head">inui利用体験アンケートのお願い</p>
            <p>メニューの「アンケート」から回答してください。</p>
          </div>
        </section>
      </div>

      <!-- スケジュール（個人週間） -->
      <section class="panel screen-week">
        <h2 class="panel-title">スケジュール（個人週間）</h2>
        <div class="panel-body">
          <p class="week-range">2026/11/02 ～ 2026/11/08</p>
          <div class="week" role="table" aria-label="週間予定">
            <div class="week-row" role="row">
              <button type="button" class="week-day is-today" role="columnheader" data-day="2026-11-02">2(月)</button>
              <button type="button" class="week-day" role="columnheader" data-day="2026-11-03">3(火)</button>
              <button type="button" class="week-day" role="columnheader" data-day="2026-11-04">4(水)</button>
              <button type="button" class="week-day" role="columnheader" data-day="2026-11-05">5(木)</button>
              <button type="button" class="week-day" role="columnheader" data-day="2026-11-06">6(金)</button>
              <button type="button" class="week-day is-sat" role="columnheader" data-day="2026-11-07">7(土)</button>
              <button type="button" class="week-day is-sun" role="columnheader" data-day="2026-11-08">8(日)</button>
            </div>
            <div class="week-row" role="row">
              <div class="week-cell is-today" role="cell"><span class="ev ev-orange">10:00-10:30<br>定例会議</span></div>
              <div class="week-cell" role="cell"><span class="ev ev-green">10:00-10:30<br>朝会</span><span class="ev ev-blue">14:00-15:00<br>MVP検証打ち合わせ</span></div>
              <div class="week-cell" role="cell"></div>
              <div class="week-cell" role="cell"></div>
              <div class="week-cell" role="cell"></div>
              <div class="week-cell is-sat" role="cell"></div>
              <div class="week-cell is-sun" role="cell"></div>
            </div>
          </div>
          <p class="panel-note">日付をクリックすると、その日の予定一覧を開きます。</p>
        </div>
      </section>
    </main>
  </div>

  <!-- モック専用：デザイン案の切り替え（ユーザー向けUIではない） -->
  <aside class="mock-panel" aria-label="モック状態の切り替え">
    <details>
      <summary>モック状態</summary>
      <div class="mock-grid">
        <span class="mock-label">デザイン案</span>
        <a href="index.html">シンプル案</a>
        <a href="groupware.html">グループウェア風</a>
        <a href="legacy.html" aria-current="page">旧形式（比較用）</a>
      </div>
    </details>
  </aside>

  <script src="app.js"></script>
  <script src="legacy.js"></script>
</body>
</html>
