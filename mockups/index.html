<!doctype html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>inui UIモックアップ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- デザイン確定用の静的モックアップ。Intent判定はキーワード照合のダミー。 -->
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">i</span>
      <span class="brand-name">inui</span>
    </div>
    <div class="header-meta">
      <span class="meta-item">2026年11月2日（月）09:00</span>
      <span class="meta-sep" aria-hidden="true">·</span>
      <span class="meta-item">検証ユーザー</span>
    </div>
  </header>

  <main class="app-main">
    <section class="intent" aria-labelledby="intent-title">
      <h1 id="intent-title" class="intent-title">何をしますか？</h1>
      <form id="intent-form" class="intent-form" autocomplete="off">
        <label for="intent-input" class="visually-hidden">やりたいことを入力</label>
        <input id="intent-input" class="intent-input" type="text"
               placeholder="例：明日の予定を見せて" maxlength="200">
        <button type="submit" class="btn btn-primary" id="intent-submit">送信</button>
      </form>
      <div class="examples" aria-label="入力例">
        <button type="button" class="chip" data-example="アンケートに回答したい">アンケートに回答したい</button>
        <button type="button" class="chip" data-example="今日のスケジュールを確認したい">今日のスケジュールを確認したい</button>
        <button type="button" class="chip" data-example="明日の予定を見せて">明日の予定を見せて</button>
        <button type="button" class="chip" data-example="表示設定を変えたい">表示設定を変えたい</button>
      </div>
    </section>

    <section id="result" class="result" aria-live="polite"></section>
  </main>

  <!-- モック専用：状態を切り替えてデザインを確認するパネル -->
  <aside class="mock-panel" aria-label="モック状態の切り替え">
    <details>
      <summary>モック状態</summary>
      <div class="mock-grid">
        <span class="mock-label">業務UI</span>
        <button type="button" data-mock="アンケートに回答したい">アンケート</button>
        <button type="button" data-mock="今日のスケジュールを確認したい">予定（今日）</button>
        <button type="button" data-mock="明日の予定を見せて">予定（明日）</button>
        <button type="button" data-mock="2026年11月4日の予定を見たい">予定（なし）</button>
        <button type="button" data-mock="表示設定を変えたい">表示設定</button>
        <span class="mock-label">案内・失敗</span>
        <button type="button" data-mock="文書を探したい">対象外の機能</button>
        <button type="button" data-mock="予定を削除して">対象外の操作</button>
        <button type="button" data-mock="開いて">特定できない</button>
        <button type="button" data-mock="予定を見たい">日付が必要</button>
        <button type="button" data-mock-state="rejected">ホスト側で拒否</button>
        <button type="button" data-mock-state="network">通信失敗</button>
        <button type="button" data-mock-state="loading">判定中</button>
        <button type="button" data-mock-state="empty">初期状態</button>
      </div>
    </details>
  </aside>

  <script src="app.js"></script>
</body>
</html>
