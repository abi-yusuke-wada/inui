name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: ソースを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Nixを準備
        uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4

      - name: 固定した依存を取得
        run: nix develop --command make app-setup

      - name: lint・型検査・ビルド・テスト
        run: nix develop --command make ci
