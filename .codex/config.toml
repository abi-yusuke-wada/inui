approval_policy = "on-request"
# GitHubへの書き込みを含む承認要求は人間に提示する。
approvals_reviewer = "user"
# 既定は読み取り専用（調査用）。実装時のみ、セッション内の /permissions で inui-dev に切り替える。
# 起動オプション -c で default_permissions を指定すると、ワークスペースの要件設定により起動できない。
# 旧 sandbox_mode・sandbox_workspace_write は権限プロファイルと併用できないため使わない。
# どちらのプロファイルもネットワークの許可を持たない（既定で無効）。
default_permissions = "inui-readonly"

# コマンドに渡す環境変数を基本的なもの（PATH・HOME等）に限定し、GH_TOKEN等の認証情報を渡さない。
# ログインシェルで起動すると起動ファイル（~/.bashrc等）が認証情報を再設定し得るため、無効にする。
allow_login_shell = false

[shell_environment_policy]
inherit = "core"

# 調査用: ファイルの変更を許可しない。
[permissions.inui-readonly]
description = "読み取り専用。機密ファイルと認証情報の読み取りを拒否する"
extends = ":read-only"

[permissions.inui-readonly.filesystem]
# Linux / WSLの再帰glob展開は、プロセス起動時にこの深さまで行う。
glob_scan_max_depth = 8
"~/.aws" = "deny"
"~/.ssh" = "deny"
"~/.gnupg" = "deny"
"~/.netrc" = "deny"
"~/.git-credentials" = "deny"
"~/.npmrc" = "deny"
"~/.config/pnpm" = "deny"
"~/.docker/config.json" = "deny"
"~/.claude/.credentials.json" = "deny"
"~/.codex/auth.json" = "deny"
"~/.config/gh" = "deny"
"~/**/.env" = "deny"
"~/**/.env.*" = "deny"

[permissions.inui-readonly.filesystem.":workspace_roots"]
".env" = "deny"
".env.*" = "deny"
".aws" = "deny"
"**/.env" = "deny"
"**/.env.*" = "deny"

# 実装用: 作業領域内の編集・テストを許可する。拒否対象は inui-readonly と同じにする。
[permissions.inui-dev]
description = "作業領域の編集を許可し、機密ファイルと認証情報の読み書きを拒否する"
extends = ":workspace"

[permissions.inui-dev.filesystem]
glob_scan_max_depth = 8
"~/.aws" = "deny"
"~/.ssh" = "deny"
"~/.gnupg" = "deny"
"~/.netrc" = "deny"
"~/.git-credentials" = "deny"
"~/.npmrc" = "deny"
"~/.config/pnpm" = "deny"
"~/.docker/config.json" = "deny"
"~/.claude/.credentials.json" = "deny"
"~/.codex/auth.json" = "deny"
"~/.config/gh" = "deny"
"~/**/.env" = "deny"
"~/**/.env.*" = "deny"

[permissions.inui-dev.filesystem.":workspace_roots"]
".env" = "deny"
".env.*" = "deny"
".aws" = "deny"
"**/.env" = "deny"
"**/.env.*" = "deny"

# 開発支援用のGitHub接続。製品MVPに延期したMCPとは別の用途。
# 専用PATの値は保存せず、Codex起動時の環境変数名だけを指定する。
# 書き込み先はPAT側でinuiだけに限定し、Contents権限は付けない。
[mcp_servers.inui_github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "INUI_GITHUB_MCP_TOKEN"
default_tools_approval_mode = "prompt"
enabled_tools = [
  "issue_read",
  "list_issues",
  "pull_request_read",
  "list_pull_requests",
  "issue_write",
  "create_pull_request",
  "update_pull_request",
  "add_issue_comment",
  "add_reply_to_pull_request_comment",
]

# サーバー側でも同じ9操作だけを要求し、merge・push・設定変更等を公開しない。
[mcp_servers.inui_github.http_headers]
X-MCP-Tools = "issue_read,list_issues,pull_request_read,list_pull_requests,issue_write,create_pull_request,update_pull_request,add_issue_comment,add_reply_to_pull_request_comment"

[mcp_servers.inui_github.tools.issue_read]
approval_mode = "approve"

[mcp_servers.inui_github.tools.list_issues]
approval_mode = "approve"

[mcp_servers.inui_github.tools.pull_request_read]
approval_mode = "approve"

[mcp_servers.inui_github.tools.list_pull_requests]
approval_mode = "approve"

[mcp_servers.inui_github.tools.issue_write]
approval_mode = "prompt"

[mcp_servers.inui_github.tools.create_pull_request]
approval_mode = "prompt"

[mcp_servers.inui_github.tools.update_pull_request]
approval_mode = "prompt"

[mcp_servers.inui_github.tools.add_issue_comment]
approval_mode = "prompt"

[mcp_servers.inui_github.tools.add_reply_to_pull_request_comment]
approval_mode = "prompt"
