approval_policy = "on-request"
default_permissions = "inui"

[permissions.inui]
description = "作業領域の編集を許可し、機密ファイルの読み書きを拒否する"
extends = ":workspace"

[permissions.inui.filesystem]
# Linux / WSLの再帰glob展開は、プロセス起動時にこの深さまで行う。
glob_scan_max_depth = 8
"~/.aws" = "deny"
# 作業に不要な認証情報の読み取りを拒否する。GitHubのトークンを含む ~/.config/gh も対象とする（ADR-0002）。
"~/.ssh" = "deny"
"~/.gnupg" = "deny"
"~/.netrc" = "deny"
"~/.git-credentials" = "deny"
"~/.claude/.credentials.json" = "deny"
"~/.codex/auth.json" = "deny"
"~/.config/gh" = "deny"
"~/**/.env" = "deny"
"~/**/.env.*" = "deny"

[permissions.inui.filesystem.":workspace_roots"]
".env" = "deny"
".env.*" = "deny"
".aws" = "deny"
"**/.env" = "deny"
"**/.env.*" = "deny"
